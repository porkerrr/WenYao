name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5 (peeled commit)
      - name: Install required Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Validate release tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Backend contract tests
        env:
          PYTHONPATH: backend
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt
          .venv/bin/python -m unittest discover -s backend/tests -v
      - name: Validate technical documentation
        shell: pwsh
        run: ./tests/Test-TechnicalSolution.ps1
      - name: Compile
        run: ./gradlew :app:compileDebugKotlin :app:compileReleaseKotlin --no-daemon --console=plain
      - name: Unit tests (offline provider fixtures)
        run: ./gradlew test --no-daemon --console=plain
      - name: Lint
        run: ./gradlew lint :app:lintRelease --no-daemon --console=plain
      - name: Debug and unsigned release builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --console=plain
